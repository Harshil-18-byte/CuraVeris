name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Backend Deployment Trigger
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render Deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully."
      - name: Skip Render Notice
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: |
          echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping automated Render webhook trigger."

  deploy-frontend:
    name: Frontend Deployment Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploys automatically on push
        run: echo "Vercel deployment triggered by git push event."
