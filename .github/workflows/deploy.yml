name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploys automatically on push
        run: echo "Vercel deploy triggered by git push"
