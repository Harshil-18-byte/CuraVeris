name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Pytest Suite
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --no-cache-dir -r requirements.txt

      - name: Run test suite
        env:
          ENV: testing
          DEBUG: "False"
          SECRET_KEY: ci-test-secret-key-replace-before-any-deployment-2026
          ENCRYPTION_KEY: Y3VyYXZlcmlzLWRldi1vbmx5LWtleS0zMmJ5dGVzLXBhZA==
          DATABASE_URL: sqlite+aiosqlite:///./test_curaveris.db
          SYNC_DATABASE_URL: sqlite:///./test_curaveris.db
          REFERENCE_DB_PATH: ./reference_data/medical_rates.db
        run: |
          cd backend
          pytest --tb=short -q --no-header

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          cd backend
          flake8 app/ --max-line-length=120 --exclude=__pycache__,venv,.pytest_cache
