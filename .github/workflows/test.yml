name: Foundation validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:

  backend:
    name: Backend test, lint, format and compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --no-cache-dir -r backend/requirements-dev.txt
      - name: Test
        env:
          ENV: testing
          DEBUG: "False"
          SECRET_KEY: ci-test-secret-key-replace-before-any-deployment-2026
          ENCRYPTION_KEY: Y3VyYXZlcmlzLWRldi1vbmx5LWtleS0zMmJ5dGVzLXBhZA==
          DATABASE_URL: sqlite+aiosqlite:///./test_curaveris.db
          SYNC_DATABASE_URL: sqlite:///./test_curaveris.db
          REFERENCE_DB_PATH: ./reference_data/medical_rates.db
        run: cd backend && pytest --tb=short -q --no-header
      - run: ruff check backend/app backend/tests
      - run: ruff format --check backend/app backend/tests
      - run: python -m py_compile backend/app/main.py backend/app/core/errors.py backend/app/core/logging.py

  web:
    name: Web type-check, lint and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: clients/web
      - run: npm run lint && npm run format:check && npm run build
        working-directory: clients/web
