name: Foundation validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          pip install --no-cache-dir ruff pytest pytest-asyncio httpx
          pip install --no-cache-dir -e backend
      - name: Run Tests
        env:
          ENV: testing
          DEBUG: "False"
          DATABASE_URL: sqlite+aiosqlite:///./test_curaveris.db
          SYNC_DATABASE_URL: sqlite:///./test_curaveris.db
          REFERENCE_DB_PATH: ./reference_data/medical_rates.db
          PYTHONPATH: backend:.
        run: cd backend && pytest --tb=short -q --no-header
      - name: Lint and Format Check
        run: |
          ruff check backend/app backend/tests
      - name: Python Bytecode Compilation
        run: python -m py_compile backend/app/main.py backend/app/core/errors.py backend/app/core/logging.py

  web:
    name: Web type-check and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Web Dependencies
        run: npm install
        working-directory: web
      - name: TypeScript Check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build Web Application
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://curaveris.onrender.com
          NEXT_PUBLIC_WS_URL: wss://curaveris.onrender.com
