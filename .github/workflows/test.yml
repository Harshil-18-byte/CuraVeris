name: Foundation validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r backend/requirements.txt
          pip install --no-cache-dir ruff pytest pytest-asyncio httpx pytest-cov
          pip install --no-cache-dir -e ./backend
      - name: Run Tests
        env:
          APP_ENV: testing
          ENV: testing
          DEBUG: "False"
          DATABASE_URL: sqlite+aiosqlite:///./test_curaveris.db
          SYNC_DATABASE_URL: sqlite:///./test_curaveris.db
          REFERENCE_DB_PATH: ./reference_data/medical_rates.db
          JWT_SECRET_KEY: test_jwt_secret_key_minimum_32_characters_long
          APP_SECRET_KEY: test_app_secret_key_minimum_32_characters_long
          EVIDENCE_HMAC_SECRET: test_evidence_hmac_secret_32_chars_long
          AWS_ACCESS_KEY_ID: test_key
          AWS_SECRET_ACCESS_KEY: test_secret
          AWS_S3_BUCKET_NAME: test-bucket
          AWS_S3_ENDPOINT_URL: http://localhost:9000
          AWS_S3_REGION: auto
          RESEND_API_KEY: test_resend_key
          EMAIL_FROM_ADDRESS: test@test.com
          ML_MODEL_PATH: ./ml_models
          STORAGE_BACKEND: local
          PYTHONPATH: backend:.
        run: pytest backend/tests --tb=short -q --no-header
      - name: Lint and Format Check
        run: |
          ruff check backend/app backend/tests --select E,F,W --ignore E501
      - name: Python Bytecode Compilation
        run: python -m py_compile backend/app/main.py backend/app/core/errors.py backend/app/core/logging.py

  web:
    name: Web type-check and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Web Dependencies
        run: npm install
        working-directory: web
      - name: TypeScript Check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build Web Application
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: https://curaveris.onrender.com
          NEXT_PUBLIC_WS_URL: wss://curaveris.onrender.com
