name: Web CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Web Build & Typecheck
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://curaveris.onrender.com
      NEXT_PUBLIC_WS_URL: wss://curaveris.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint --if-present

      - name: Build Web Application
        working-directory: web
        run: npm run build
