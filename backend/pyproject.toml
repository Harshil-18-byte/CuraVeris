[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curaveris-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "celery[redis]>=5.3.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "boto3>=1.34.0",
  "pytesseract>=0.3.10",
  "easyocr>=1.7.0",
  "pdfminer.six>=20221105",
  "pymupdf>=1.24.0",
  "pillow>=10.0.0",
  "xgboost>=2.0.0",
  "torch>=2.2.0",
  "shap>=0.45.0",
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "scipy>=1.12.0",
  "httpx>=0.27.0",
  "resend>=0.7.0",
  "weasyprint>=62.0",
  "jinja2>=3.1.0",
  "python-magic>=0.4.27",
  "cryptography>=42.0.0",
  "sentry-sdk[fastapi]>=1.45.0",
  "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
