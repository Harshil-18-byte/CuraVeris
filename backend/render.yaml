services:
  - type: web
    name: curaveris-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: EVIDENCE_HMAC_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION
        value: auto
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: ML_MODEL_PATH
        value: ./ml_models
      - key: STORAGE_BACKEND
        value: s3
      - key: SENTRY_DSN
        value: ""
      - key: PORT
        value: "8000"

  - type: worker
    name: curaveris-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    startCommand: celery -A app.workers.celery_app worker --loglevel=info -Q bill_processing,notifications,default --concurrency=1 --without-heartbeat
    envVars:
      - fromGroup: curaveris-env
