services:
  backend:
    build: ./backend
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://curaveris:curaveris@postgres:5432/curaveris
      SYNC_DATABASE_URL: postgresql://curaveris:curaveris@postgres:5432/curaveris
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your environment}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: curaveris
      POSTGRES_USER: curaveris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curaveris -d curaveris"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
