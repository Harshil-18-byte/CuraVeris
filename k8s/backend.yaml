apiVersion: v1
kind: Service
metadata:
  name: curaveris-backend
  namespace: curaveris
  labels:
    app.kubernetes.io/name: curaveris-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: curaveris-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curaveris-backend
  namespace: curaveris
  labels:
    app.kubernetes.io/name: curaveris-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: curaveris-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curaveris-backend
    spec:
      containers:
        - name: backend
          image: curaveris-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: curaveris-config
            - secretRef:
                name: curaveris-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: curaveris-backend-hpa
  namespace: curaveris
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: curaveris-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
