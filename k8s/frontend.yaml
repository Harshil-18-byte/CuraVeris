apiVersion: v1
kind: Service
metadata:
  name: curaveris-web
  namespace: curaveris
  labels:
    app.kubernetes.io/name: curaveris-web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: curaveris-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curaveris-web
  namespace: curaveris
  labels:
    app.kubernetes.io/name: curaveris-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: curaveris-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curaveris-web
    spec:
      containers:
        - name: web
          image: curaveris-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: curaveris-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
