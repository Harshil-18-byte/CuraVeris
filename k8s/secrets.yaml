apiVersion: v1
kind: Secret
metadata:
  name: curaveris-secrets
  namespace: curaveris
  labels:
    app.kubernetes.io/name: curaveris
type: Opaque
stringData:
  POSTGRES_DB: "curaveris"
  POSTGRES_USER: "curaveris"
  POSTGRES_PASSWORD: "curaveris_secure_prod_password"
  SECRET_KEY: "prod_curaveris_secret_key_32_bytes_long_key"
  ENCRYPTION_KEY: "prod_curaveris_aes_256_gcm_master_key_32b"
