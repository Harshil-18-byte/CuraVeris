apiVersion: apps/v1
kind: Deployment
metadata:
  name: curaveris-worker
  namespace: curaveris
  labels:
    app.kubernetes.io/name: curaveris-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: curaveris-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curaveris-worker
    spec:
      containers:
        - name: worker
          image: curaveris-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.evidence_task"]
          envFrom:
            - configMapRef:
                name: curaveris-config
            - secretRef:
                name: curaveris-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
